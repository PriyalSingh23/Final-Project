name: lpi-v4-ci

# What this proves, in order of cost:
#   1. the crypto + framing + sync + decode chain round-trips  (tests/test_lpi_v4.py)
#   2. a short real training run reaches the gate on CPU        (train --epochs 6)
#   3. the exported artefacts actually load in the GRC/USRP path (lpi_grc.py selftest)
# Every job fails on a *metric regression*, not only on an exception, so a commit
# that quietly breaks the receiver cannot land.

on:
  push:
    paths:
      - "lpi_v4/**"
      - "tests/**"
      - "colab/**"
      - ".github/workflows/ci.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: loopback + framing tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy pytest pyyaml reedsolo pycryptodome
          pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: tests
        run: python -m pytest tests -q -m "not slow"
        env:
          OMP_NUM_THREADS: "2"

  train-and-gate:
    name: 6-epoch CPU train + metric gate
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy pyyaml reedsolo pycryptodome
          pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: train (short)
        working-directory: lpi_v4
        run: |
          # --export-dir keeps the smoke model's TorchScript out of run/, which is
          # where the .grc flowgraphs and tx/rx_usrp.py read the shipped exports from.
          python lpi_train.py --epochs 6 --steps 12 --batch 32 \
              --out run/ci.pt --log run/ci.csv --tb "" \
              --export-dir run/ci_export 2>&1 | tee run/ci.log
      - name: link + message gate (this is the step that fails on a regression)
        working-directory: lpi_v4
        run: |
          # --no-fail: a 6-epoch CI model is not expected to pass the *whole* gate
          # (its own warden is barely trained), so the gate verdict comes from the
          # explicit subset below, not from lpi_eval's exit code.
          python lpi_eval.py --ckpt run/ci.best.pt --frames 96 --snrs 5,8 --no-fail \
              --out-json run/ci_eval.json --md run/ci_eval.md
          python - <<'PY'
          import json, sys
          # working-directory is lpi_v4, so this path is relative to that folder
          r = json.load(open("run/ci_eval.json"))
          g = r["gate"]
          print(json.dumps(g, indent=1))
          # a 6-epoch CI model is not expected to hit the full field gate; it IS
          # expected to prove the receiver works, so only these are hard:
          hard = ["ber_field<1%", "fer<5%", "capture_decodes", "ks>0.05"]
          bad = [k for k in hard if not g.get(k)]
          if bad:
              sys.exit(f"REGRESSION: {bad} -- see the artefacts")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lpi-v4-ci-run
          path: |
            lpi_v4/run/ci.csv
            lpi_v4/run/ci.log
            lpi_v4/run/ci_eval.json
            lpi_v4/run/ci_eval.md
          retention-days: 14
          if-no-files-found: warn
